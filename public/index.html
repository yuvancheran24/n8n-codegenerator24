<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Output Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* --- CSS STYLES --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Fira Code', 'Consolas', monospace;
}

body {
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
    position: relative;
    overflow-x: hidden;
}

/* Background elements */
.bg-elements { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
.bg-element { position: absolute; border-radius: 50%; background: rgba(0, 194, 255, 0.1); animation: float 15s infinite linear; }
.bg-element:nth-child(1) { width: 300px; height: 300px; top: 10%; left: 5%; animation-delay: 0s; }
.bg-element:nth-child(2) { width: 200px; height: 200px; top: 60%; left: 80%; animation-delay: -5s; }
.bg-element:nth-child(3) { width: 150px; height: 150px; top: 20%; left: 70%; animation-delay: -10s; }
.bg-element:nth-child(4) { width: 250px; height: 250px; top: 70%; left: 10%; animation-delay: -7s; }

@keyframes float {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
    50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
    100% { transform: translateY(0) rotate(360deg); opacity: 0.7; }
}

.header { text-align: center; margin-bottom: 30px; }
.brand { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
.logo { width: 70px; height: 70px; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 194, 255, 0.3); background: #161b22; }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.brand-name { color: #00c2ff; font-size: 2.5rem; text-shadow: 0 0 15px rgba(0, 194, 255, 0.3); }
.header p { color: #8b949e; font-size: 1.1rem; }

.quiz-title {
    color: #f0f6fc; text-align: center; margin-bottom: 25px; font-size: 1.4rem;
    background: linear-gradient(135deg, #00c2ff, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.editor-box {
    width: 700px; background: #161b22; border-radius: 15px; padding: 30px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid #30363d; position: relative; z-index: 10;
}

.watermark { position: absolute; top: 15px; right: 20px; color: rgba(255, 255, 255, 0.3); font-size: 12px; font-style: italic; }

.brand-footer {
    position: absolute; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 10px;
    background: rgba(30, 34, 41, 0.9); padding: 8px 15px; border-radius: 8px; border-left: 3px solid #00c2ff;
}
.brand-footer-logo { width: 65px; height: 65px; border-radius: 6px; overflow: hidden; }
.brand-footer-logo img { width: 100%; height: 100%; object-fit: cover; }
.brand-footer-name { color: #f0f6fc; font-size: 14px; font-weight: 600; }
.brand-footer-handle { color: #00c2ff; font-size: 12px; }

.title-bar { display: flex; gap: 8px; margin-bottom: 20px; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.red { background:#40ccc5; }
.yellow { background:#e1e6e5; }
.green { background:#40ccc5; }
.file-info { display: flex; align-items: center; gap: 10px; margin-left: 15px; }
.python-icon { color: #1cb4be; font-size: 18px; }
.file-name { color: #f0f6fc; font-size: 16px; font-weight: 600; }

.code-container {
    background: #0d1117; padding: 25px; border-radius: 10px; font-size: 14px;
    overflow-x: auto; border: 1px solid #30363d; margin: 0; min-height: 300px;
    direction: ltr; text-align: left; position: relative;
}

/* Crucial styles for the editor */
pre { margin: 0 !important; border: none !important; background: transparent !important; }
code { font-family: 'Fira Code', 'Consolas', monospace !important; line-height: 1.5; white-space: pre-wrap !important; }

/* The editable area style */
.editable-code {
    outline: none;
    min-height: 250px;
    display: block;
    caret-color: #00c2ff; 
    color: #f0f6fc;
}

.controls { display: flex; gap: 15px; margin-top: 25px; justify-content: center; }
button {
    background: linear-gradient(135deg, #00c2ff, #0099cc); color: white; padding: 12px 25px;
    border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0, 194, 255, 0.3);
}
button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 194, 255, 0.4); }
button.secondary { background: linear-gradient(135deg, #8b949e, #6e7681); }
button.secondary:hover { box-shadow: 0 6px 20px rgba(139, 148, 158, 0.4); }

.screenshot-preview {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9); z-index: 1000; justify-content: center;
    align-items: center; flex-direction: column; padding: 20px;
}
.preview-image { max-width: 90%; max-height: 80%; display: flex; justify-content: center; align-items: center; }
.preview-image canvas { border-radius: 20px; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7); border: 1px solid #30363d; display: block; margin: 0 auto; }
.preview-actions { margin-top: 20px; display: flex; gap: 15px; }

.answer-section {
    margin-top: 20px; padding: 15px; background: #1e2229; border-radius: 8px;
    border-left: 4px solid #00c2ff; display: none;
}
.answer-section h3 { color: #00c2ff; margin-bottom: 10px; }
.answer-section pre { background: #0d1117 !important; padding: 15px; margin-top: 10px; }

.toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #00c2ff; color: white; padding: 12px 20px; border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0, 194, 255, 0.4); z-index: 1001;
    display: none; align-items: center; gap: 10px;
}
.toast.show { display: flex; animation: fadeInOut 3s ease-in-out; }
@keyframes fadeInOut { 0% { opacity: 0; bottom: 0; } 20% { opacity: 1; bottom: 20px; } 80% { opacity: 1; bottom: 20px; } 100% { opacity: 0; bottom: 0; } }

/* Screenshot Specific Styles */
.screenshot-wrapper { width: auto; display: flex; justify-content: center; align-items: center; }
.screenshot-container {
    width: 800px; background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    border-radius: 20px; padding: 40px; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
    border: 1px solid #30363d; position: relative; overflow: hidden; margin: 0 auto;
}
.screenshot-header { text-align: center; margin-bottom: 30px; }
.screenshot-brand { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
.screenshot-logo { width: 80px; height: 80px; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 194, 255, 0.3); background: #161b22; }
.screenshot-logo img { width: 100%; height: 100%; object-fit: cover; }
.screenshot-brand-name { color: #00c2ff; font-size: 2.8rem; text-shadow: 0 0 15px rgba(0, 194, 255, 0.3); }
.screenshot-title { color: #f0f6fc; text-align: center; margin-bottom: 25px; font-size: 1.4rem; background: linear-gradient(135deg, #00c2ff, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.screenshot-editor-box { background: #161b22; border-radius: 15px; padding: 30px; border: 1px solid #30363d; position: relative; }
.screenshot-watermark { position: absolute; top: 15px; right: 20px; color: rgba(255, 255, 255, 0.3); font-size: 12px; font-style: italic; }
.screenshot-footer { position: absolute; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 10px; background: rgba(30, 34, 41, 0.9); padding: 8px 15px; border-radius: 8px; border-left: 3px solid #00c2ff; }
.screenshot-footer-logo { width: 65px; height: 65px; border-radius: 6px; overflow: hidden; }
.screenshot-footer-logo img { width: 100%; height: 100%; object-fit: cover; }
.screenshot-footer-name { color: #f0f6fc; font-size: 14px; font-weight: 600; }
.screenshot-footer-handle { color: #00c2ff; font-size: 12px; }
.screenshot-title-bar { display: flex; gap: 8px; margin-bottom: 20px; align-items: center; }
.screenshot-dot { width: 12px; height: 12px; border-radius: 50%; }
.screenshot-red { background:#40ccc5; }
.screenshot-yellow { background:#e1e6e5; }
.screenshot-green { background:#40ccc5; }
.screenshot-file-info { display: flex; align-items: center; gap: 10px; margin-left: 15px; }
.screenshot-python-icon { color: #1cb4be; font-size: 18px; }
.screenshot-file-name { color: #f0f6fc; font-size: 16px; font-weight: 600; }
.screenshot-code-container { background: #0d1117; padding: 25px; border-radius: 10px; font-size: 15px; overflow-x: auto; border: 1px solid #30363d; margin: 0; min-height: 320px; direction: ltr; text-align: left; }
.screenshot-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
.screenshot-bg-element { position: absolute; border-radius: 50%; background: rgba(0, 194, 255, 0.1); animation: preview-float 20s infinite linear; }
.screenshot-bg-element:nth-child(1) { width: 200px; height: 200px; top: 10%; left: 5%; animation-delay: 0s; }
.screenshot-bg-element:nth-child(2) { width: 150px; height: 150px; top: 60%; left: 80%; animation-delay: -5s; }
.screenshot-bg-element:nth-child(3) { width: 100px; height: 100px; top: 20%; left: 70%; animation-delay: -10s; }

@keyframes preview-float { 0% { transform: translateY(0) rotate(0deg); opacity: 0.7; } 50% { transform: translateY(-15px) rotate(180deg); opacity: 0.3; } 100% { transform: translateY(0) rotate(360deg); opacity: 0.7; } }

@media (max-width: 768px) {
    .editor-box { width: 95%; padding: 20px; }
    .code-container { min-height: 250px; padding: 15px; }
    .editable-code { min-height: 200px; }
    .controls { flex-direction: column; align-items: center; }
    button { width: 100%; max-width: 250px; }
}
</style>
</head>
<body>

<div class="bg-elements">
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
</div>

<div class="header">
    <div class="brand">
        <div class="logo"></div>
        <h1 class="brand-name">ᴍʀ ᴘʀᴏɢʀᴀᴍᴍᴇʀ</h1>
    </div>
    <p>Test your programming knowledge</p>
</div>

<div class="editor-box" id="captureArea">
    <div class="watermark"></div>
    
    <div class="brand-footer" id="brandFooter">
        <div class="brand-footer-logo"></div>
        <div class="brand-footer-info">
            <div class="brand-footer-name">ᴍʀ ᴘʀᴏɢʀᴀᴍᴍᴇʀ</div>
            <div class="brand-footer-handle">@mr_programmer_24</div>
        </div>
    </div>
    
    <div class="quiz-title">What will be the output of the following code?</div>
    
    <div class="title-bar">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
        <div class="file-info">
            <i class="fab fa-python python-icon"></i>
            <div class="file-name">Python Quiz</div>
        </div>
    </div>

    <div class="code-container">
        <code class="language-python editable-code" id="codeBlock"></code>
    </div>
    
    <div class="answer-section" id="answerSection">
        <h3>Expected Output:</h3>
        <pre><code class="language-python" id="outputBlock"></code></pre>
    </div>
</div>

<div class="controls">
    <button onclick="takeScreenshot()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21,15 16,10 5,21"></polyline>
        </svg>
        Take Screenshot
    </button>
    <button class="secondary" onclick="copyCode()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Copy Code
    </button>
    <button class="secondary" onclick="showAnswer()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        Show Answer
    </button>
</div>

<div id="screenshotPreview" class="screenshot-preview">
    <div id="previewImage" class="preview-image"></div>
    <div class="preview-actions">
        <button onclick="downloadImage()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7,10 12,15 17,10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download PNG
        </button>
        <button class="secondary" onclick="closePreview()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            Close
        </button>
    </div>
</div>

<div id="toast" class="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage">Operation completed successfully!</span>
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/prism.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-python.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codejar/3.2.0/codejar.min.js"></script>

<script>
// --- INITIAL DATA ---
let initialCode = `def tricky_function():
    x = [1, 2, 3]
    y = x
    y.append(4)
    return x

result = tricky_function()
print(result)`;

let expectedOutput = `[1, 2, 3, 4]`;

// --- DOM ELEMENTS ---
const codeElement = document.getElementById("codeBlock");
const outputElement = document.getElementById("outputBlock");
const answerSection = document.getElementById("answerSection");

// --- CODEJAR SETUP (The Fix) ---
// CodeJar takes the element and a highlight function
const jar = CodeJar(codeElement, (editor) => {
    // We must pass the editor content to Prism
    Prism.highlightElement(editor);
});

// Load the initial code into the editor
jar.updateCode(initialCode);

// --- SCREENSHOT LOGIC ---
function takeScreenshot() {
    // 1. Create a wrapper to hold the screenshot off-screen
    const screenshotWrapper = document.createElement('div');
    screenshotWrapper.className = 'screenshot-wrapper';
    screenshotWrapper.style.position = 'absolute';
    screenshotWrapper.style.top = '0';
    screenshotWrapper.style.left = '-9999px';
    
    // 2. Create the container
    const screenshotContainer = document.createElement('div');
    screenshotContainer.className = 'screenshot-container';
    
    // Background
    screenshotContainer.innerHTML = `
        <div class="screenshot-bg">
            <div class="screenshot-bg-element"></div>
            <div class="screenshot-bg-element"></div>
            <div class="screenshot-bg-element"></div>
        </div>
    `;
    
    // Header
    const header = document.createElement('div');
    header.className = 'screenshot-header';
    header.innerHTML = `
        <div class="screenshot-brand">
            <div class="screenshot-logo">
                <img src="https://i.ibb.co/dwHRbkBZ/photo-2025-11-16-15-31-47.jpg" alt="MR PROGRAMMER">
            </div>
            <h1 class="screenshot-brand-name">ᴍʀ ᴘʀᴏɢʀᴀᴍᴍᴇʀ</h1>
        </div>
        <p style="color: #8b949e; font-size: 1.1rem;">Test your programming knowledge</p>
    `;
    screenshotContainer.appendChild(header);
    
    // Editor Box
    const editorBox = document.createElement('div');
    editorBox.className = 'screenshot-editor-box';
    
    // Watermark
    const watermark = document.createElement('div');
    watermark.className = 'screenshot-watermark';
    watermark.textContent = '@mr_programmer_24';
    editorBox.appendChild(watermark);
    
    // Footer
    const footer = document.createElement('div');
    footer.className = 'screenshot-footer';
    footer.innerHTML = `
        <div class="screenshot-footer-logo">
            <img src="https://i.ibb.co/dwHRbkBZ/photo-2025-11-16-15-31-47.jpg" alt="MR PROGRAMMER">
        </div>
        <div class="screenshot-footer-info">
            <div class="screenshot-footer-name">ᴍʀ ᴘʀᴏɢʀᴀᴍᴍᴇʀ</div>
            <div class="screenshot-footer-handle">@mr_programmer_24</div>
        </div>
    `;
    editorBox.appendChild(footer);
    
    // Title
    const quizTitle = document.createElement('div');
    quizTitle.className = 'screenshot-title';
    quizTitle.textContent = 'What will be the output of the following code?';
    editorBox.appendChild(quizTitle);
    
    // Title Bar
    const titleBar = document.createElement('div');
    titleBar.className = 'screenshot-title-bar';
    titleBar.innerHTML = `
        <div class="screenshot-dot screenshot-red"></div>
        <div class="screenshot-dot screenshot-yellow"></div>
        <div class="screenshot-dot screenshot-green"></div>
        <div class="screenshot-file-info">
            <i class="fab fa-python screenshot-python-icon"></i>
            <div class="screenshot-file-name">Python Quiz</div>
        </div>
    `;
    editorBox.appendChild(titleBar);
    
    // Code Container (Rebuilding it for the screenshot)
    const codeContainer = document.createElement('div');
    codeContainer.className = 'screenshot-code-container';
    
    const pre = document.createElement('pre');
    const code = document.createElement('code');
    code.className = 'language-python';
    
    // IMPORTANT: Get the code from CodeJar, not innerText
    code.textContent = jar.toString();
    
    pre.appendChild(code);
    codeContainer.appendChild(pre);
    editorBox.appendChild(codeContainer);
    screenshotContainer.appendChild(editorBox);
    screenshotWrapper.appendChild(screenshotContainer);
    
    document.body.appendChild(screenshotWrapper);
    
    // Highlight the screenshot code explicitly
    Prism.highlightElement(code);
    
    // Capture
    html2canvas(screenshotContainer, {
        scale: 2,
        backgroundColor: null,
        useCORS: true,
        allowTaint: true
    }).then(canvas => {
        const preview = document.getElementById("previewImage");
        preview.innerHTML = '';
        
        canvas.style.display = 'block';
        canvas.style.margin = '0 auto';
        canvas.style.maxWidth = '100%';
        canvas.style.height = 'auto';
        preview.appendChild(canvas);
        
        document.getElementById("screenshotPreview").style.display = 'flex';
        document.body.removeChild(screenshotWrapper);
    }).catch(error => {
        console.error('Screenshot error:', error);
        if (document.body.contains(screenshotWrapper)) {
            document.body.removeChild(screenshotWrapper);
        }
        showToast('Error taking screenshot.');
    });
}

function downloadImage() {
    const canvas = document.querySelector("#previewImage canvas");
    if (canvas) {
        const link = document.createElement("a");
        link.download = "mr-programmer-quiz.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
        showToast('Image downloaded successfully!');
    }
}

function closePreview() {
    document.getElementById("screenshotPreview").style.display = 'none';
}

function copyCode() {
    // Get code from Jar
    navigator.clipboard.writeText(jar.toString()).then(() => {
        showToast('Quiz code copied to clipboard!');
    });
}

function showAnswer() {
    outputElement.textContent = expectedOutput;
    answerSection.style.display = 'block';
    Prism.highlightElement(outputElement);
}

function showToast(message) {
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    toastMessage.textContent = message;
    toast.classList.add('show');
    
    setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

// Function to update branding dynamically if needed
function updateBranding(logoImageUrl, brandName, instagramHandle) {
    const logo = document.querySelector('.logo');
    const brand = document.querySelector('.brand-name');
    const watermark = document.querySelector('.watermark');
    const footerLogo = document.querySelector('.brand-footer-logo');
    const footerName = document.querySelector('.brand-footer-name');
    const footerHandle = document.querySelector('.brand-footer-handle');
    
    logo.innerHTML = `<img src="${logoImageUrl}" alt="${brandName}" onerror="this.style.display='none'">`;
    brand.textContent = brandName;
    watermark.textContent = `@${instagramHandle}`;
    
    footerLogo.innerHTML = `<img src="${logoImageUrl}" alt="${brandName}" onerror="this.style.display='none'">`;
    footerName.textContent = brandName;
    footerHandle.textContent = `@${instagramHandle}`;
}

// Initialize branding
updateBranding(
    'https://i.ibb.co/dwHRbkBZ/photo-2025-11-16-15-31-47.jpg',
    'ᴍʀ ᴘʀᴏɢʀᴀᴍᴍᴇʀ',
    'mr_programmer_24'
);

</script>
</body>
</html>
